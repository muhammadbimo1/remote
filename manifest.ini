[ABOUT]
NAME = Broadcaster Remote
AUTHOR = Beemo
VERSION = 1.0
DESCRIPTION = Broadcast camera and driver control with web remote support.

[CORE]
LAZY = PARTIAL

[RENDER_CALLBACKS]
TRANSPARENT = renderStinger

[WINDOW_...]
ID = main
NAME = Broadcaster Remote
FUNCTION_MAIN = windowMain
SIZE = 380, 600
PADDING = 8

[WINDOW_...]
ID = live_replay
NAME = Live / Replay
FUNCTION_MAIN = windowLiveReplay
SIZE = 200, 48
PADDING = 0
FLAGS = NO_BACKGROUND, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, FLOATING_TITLE_BAR, AUTO_RESIZE

[WINDOW_...]
ID = live_replay_settings
NAME = Live / Replay Settings
FUNCTION_MAIN = windowLiveReplaySettings
SIZE = 320, 80
